<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.css" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#181818;--panel:#1b1b1b;--ink:#e8e8e8;--muted:#858585;--line:#252525;--event:#6b2b22;--event-border:#ff3434;--event-text:#f4eeee;--accent:#b7b7b7;--now-red:#ff5252}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh}
header{height:78px;display:flex;align-items:center;gap:13px;padding:0 clamp(18px,3vw,32px);background:#181818;border-bottom:1px solid #242424}
.logo{width:32px;height:32px;display:grid;place-items:center;color:#e4e4e4;flex-shrink:0}
.logo svg{width:30px;height:30px;stroke:currentColor}
h1{margin:0;font-size:clamp(21px,2.6vw,27px);letter-spacing:-.65px;font-weight:700}
main{max-width:1700px;margin:0 auto;padding:16px 18px 26px}
.calendar-shell{background:var(--panel);border:1px solid #252525;border-radius:3px;padding:0;overflow:hidden}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:18px 20px 15px;background:#1a1a1a}
.toolbar h2{font-size:clamp(20px,2.4vw,26px);letter-spacing:-.55px;margin:0;font-weight:650}
.controls{display:flex;align-items:center;gap:6px}
button{font:inherit;font-size:12px;font-weight:500;border:1px solid #353535;background:#202020;color:#e4e4e4;padding:9px 13px;border-radius:4px;cursor:pointer}
button:hover{background:#2a2a2a;border-color:#5b5b5b}
button:focus-visible{outline:2px solid #bcbcbc;outline-offset:2px}
.arrow{font-size:20px;line-height:15px;width:35px;padding:8px}
.today{margin-left:5px}
#status{font-size:12px;color:var(--muted);margin:0;padding:0 20px 8px;min-height:0}
.fc{--fc-border-color:#292929;--fc-page-bg-color:var(--panel);--fc-neutral-bg-color:#1a1a1a;--fc-list-event-hover-bg-color:#242424;--fc-today-bg-color:#1d1d1d;--fc-now-indicator-color:var(--now-red);font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.fc .fc-toolbar{display:none}
.fc .fc-scrollgrid,.fc td,.fc th{border-color:#292929!important}
.fc .fc-timegrid-col{border-left:1px solid #292929!important;border-right:1px solid #292929!important}
.fc .fc-col-header-cell{border-left:1px solid #292929!important;border-right:1px solid #292929!important}
.fc .fc-timegrid-now-indicator-line{border-top:2px solid rgba(255,82,82,.28)!important;z-index:8}
.fc .fc-timegrid-now-indicator-arrow{border-color:var(--now-red)!important;border-top-color:transparent!important;border-bottom-color:transparent!important}
.fc .fc-col-header-cell.fc-day-today .fc-col-header-cell-cushion{background:var(--now-red);color:#fff!important;border-radius:5px;padding:4px 7px;margin:5px 0}
.fc .fc-timegrid-col.fc-day-today{background:#1d1d1d!important}
#currentTimeLabel{position:absolute;z-index:20;left:0;transform:translateY(-50%);background:var(--now-red);color:white;font-size:11px;font-weight:700;line-height:1;padding:5px 7px;border-radius:5px;white-space:nowrap;pointer-events:none}
#currentDayLine{position:absolute;z-index:9;height:0;border-top:2px solid var(--now-red);pointer-events:none}
.fc .fc-col-header-cell{background:#191919}
.fc .fc-col-header-cell-cushion{color:#8f8f8f;font-size:12px;font-weight:500;padding:11px 3px}
.fc .fc-timegrid-slot-label-cushion{color:#8c8c8c;font-size:11px}
.fc .fc-timegrid-axis,.fc .fc-timegrid-slot{background:#191919}
.fc .fc-timegrid-axis-cushion{color:#8c8c8c}
.fc .fc-daygrid-day-number{color:#aaa;font-size:12px;padding:8px}
.fc .fc-day-today{background:#1d1d1d!important}
.fc .fc-event,.fc .fc-daygrid-event{background:var(--event)!important;border:0!important;border-left:5px solid var(--event-border)!important;color:var(--event-text)!important;border-radius:5px}
.fc .fc-event-title,.fc .fc-event-time{color:var(--event-text)!important;font-size:12px;font-weight:650;letter-spacing:-.1px}
.fc .unavailable-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0;
  line-height: 1.2;
}
.fc .fc-timegrid-event{padding:5px 5px 4px}
.fc .fc-timegrid-event .fc-event-time{display:none}
.fc .fc-daygrid-event{padding:3px 5px}
.fc .fc-daygrid-event-dot{display:none}
.fc .fc-more-link{color:#aaa}
.fc .fc-highlight{background:#303030}
.fc .fc-timegrid-slot{height:3.5em}
@media(max-width:650px){header{height:68px}.toolbar{padding:14px 12px 12px}.controls{gap:4px}button{padding:8px 9px;font-size:11px}.arrow{width:31px;padding:7px}main{padding:8px}.fc .fc-col-header-cell-cushion{font-size:10px;padding:9px 1px}.fc .fc-timegrid-slot-label-cushion{font-size:9px}.fc .fc-event-title{font-size:10px}.fc .fc-timegrid-slot{height:2.8em}}
</style>
</head>
<body>
<main>
  <section class="calendar-shell" aria-label="Availability calendar">
    <div class="toolbar">
      <h2 id="rangeTitle">This week</h2>
      <div class="controls">
        <button class="arrow" id="prev" aria-label="Previous week">‹</button>
        <button class="arrow" id="next" aria-label="Next week">›</button>
        <button class="today" id="today">Today</button>
      </div>
    </div>
    <p id="status" role="status"></p>
    <div id="calendar" style="position:relative"><div id="currentTimeLabel" hidden></div><div id="currentDayLine" hidden></div></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>
<script>
(() => {
  const API_KEY = '';
  const CALENDAR_IDS = [];
  const $ = id => document.getElementById(id);
  let calendar;

  function renderRange() {
    $('rangeTitle').textContent = "Andrew Shapiro's Availability";
    requestAnimationFrame(syncCurrentTimeUI);
  }

function syncCurrentTimeUI() {
  if (!calendar) return;

  const root = $('calendar');
  const label = $('currentTimeLabel');
  const boldLine = $('currentDayLine');

  if (!root || !label || !boldLine) return;

  const todayCol = root.querySelector(
    '.fc-timegrid-col.fc-day-today'
  );
  const topSlot = root.querySelector(
    '.fc-timegrid-slot[data-time="08:00:00"]'
  );
  const bottomSlot = root.querySelector(
    '.fc-timegrid-slot[data-time="23:00:00"]'
  );
  const axis = root.querySelector('.fc-timegrid-axis');

  if (!todayCol || !topSlot || !bottomSlot || !axis) {
    label.hidden = true;
    boldLine.hidden = true;
    return;
  }

  const now = new Date();
  const minutes =
    now.getHours() * 60 +
    now.getMinutes() +
    now.getSeconds() / 60;

  if (minutes < 480 || minutes > 1380) {
    label.hidden = true;
    boldLine.hidden = true;
    return;
  }

  const rootRect = root.getBoundingClientRect();
  const top = topSlot.getBoundingClientRect().top;
  const bottom = bottomSlot.getBoundingClientRect().top;

  const y = top + ((minutes - 480) / 900) * (bottom - top);
  const colRect = todayCol.getBoundingClientRect();

  label.textContent = now.toLocaleTimeString([], {
    hour: 'numeric',
    minute: '2-digit'
  });
  label.style.top = `${y - rootRect.top}px`;
  label.style.left = `${axis.getBoundingClientRect().left - rootRect.left}px`;

  boldLine.style.top = `${y - rootRect.top}px`;
  boldLine.style.left = `${colRect.left - rootRect.left}px`;
  boldLine.style.width = `${colRect.width}px`;

  label.hidden = false;
  boldLine.hidden = false;
}

  calendar = new FullCalendar.Calendar($('calendar'), {
    initialView: 'timeGridWeek',
    firstDay: 0,
    height: 'auto',
    expandRows: true,
    nowIndicator: true,
    slotMinTime: '08:00:00',
    slotMaxTime: '23:00:00',
    slotDuration: '01:00:00',
    allDaySlot: false,
    headerToolbar: false,
    dayHeaderContent: arg => {
      const d = arg.date;
      const weekday = d.toLocaleDateString('en-US', {weekday:'short'});
      const date = `${d.getMonth()+1}/${d.getDate()}`;
      return { html: `<span>${weekday}, ${date}</span>` };
    },
    eventDisplay: 'block',
    displayEventTime: false,
    datesSet: renderRange,
    eventContent: () => ({
  html: '<span class="unavailable-label">Busy</span>'
}),
    eventClick: info => info.jsEvent.preventDefault(),
    eventDidMount: info => { info.el.title = 'Busy'; info.el.setAttribute('aria-label','Busy'); },
    events: async (fetchInfo, success, failure) => {
      if (!API_KEY || CALENDAR_IDS.length === 0) {
        $('status').textContent = '';
        success([]);
        return;
      }
      try {
        const results = await Promise.all(CALENDAR_IDS.map(async id => {
          const body = {
            timeMin: fetchInfo.start.toISOString(),
            timeMax: fetchInfo.end.toISOString(),
            timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            items: [{ id }]
          };
          const response = await fetch('https://www.googleapis.com/calendar/v3/freeBusy?key=' + encodeURIComponent(API_KEY), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          if (!response.ok) {
            console.error('Google Calendar API error:', await response.text());
            throw new Error('FreeBusy request failed: ' + response.status);
          }
          const data = await response.json();
          const busy = data.calendars && data.calendars[id] && data.calendars[id].busy || [];
          return busy.map(item => ({
            start: item.start,
            end: item.end,
            title: 'Busy',
            backgroundColor: '#6b2b22',
            borderColor: '#ff3434',
            textColor: '#f4eeee'
          }));
        }));
        $('status').textContent = '';
        success(results.flat());
      } catch (error) {
        $('status').textContent = 'api issue.';
        failure(error);
      }
    }
  });
  calendar.render();
renderRange();

$('prev').addEventListener('click', () => calendar.prev());
$('next').addEventListener('click', () => calendar.next());
$('today').addEventListener('click', () => calendar.today());

setInterval(syncCurrentTimeUI, 15000);
})();
</script>
</body>
</html>
